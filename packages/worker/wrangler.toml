name = "deslop-worker"
main = "src/index.ts"
compatibility_date = "2026-10-02"
preview_urls = false

# Static site (landing page) — file-matching GETs are served from here,
# everything else (POST /analyze, POST /feedback, preflights) hits the Worker.
[assets]
directory = "./public"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "FEEDBACK_BUCKET"
bucket_name = "slop-feedback"

[[kv_namespaces]]
binding = "VERDICTS"
id = "b6649328b85942b3acd93ae87a2a68dc"

[[kv_namespaces]]
binding = "QUOTA"
id = "e444afe5b38d4ebdbc35e0644bbcd81f"
